<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook - Log In or Sign Up</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <div class="login-container">
    <div class="brand-column">
      <h1 class="brand">facebook</h1>
      <p class="brand-subtitle">Connect with friends and the world around you.</p>
    </div>
    <div class="form-column">
      <form id="loginForm" class="login-form">
        <input type="text" id="email" placeholder="Email or phone number" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="btn primary">Log In</button>
        <a class="link small" href="#" id="forgotLink">Forgot password?</a>
        <hr />
        <button type="button" class="btn success" id="createAccountBtn">Create new account</button>
      </form>
      <p class="page-cta"><a href="#" class="link">Create a Page</a> for a celebrity, brand or business.</p>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="langs">
        <a href="#" class="link small">English (US)</a>
        <a href="#" class="link small">Español</a>
        <a href="#" class="link small">Français (France)</a>
        <a href="#" class="link small">العربية</a>
        <a href="#" class="link small">Deutsch</a>
      </div>
      <div class="meta small">
        © 2025 SimpleBook
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    window.__APP_CONFIG__ = { homeHref: 'home.html' };
  </script>
</body>
</html>
